# Mosquitto 2.x: configuración segura del proyecto (contramedida ante suplantación)
#
#   mosquitto -c config/mosquitto/mosquitto.conf -v
#
# Las rutas relativas se resuelven desde la carpeta en que se lanza mosquitto
# (ejecutar desde la raíz del proyecto o reemplazarlas por rutas absolutas).

# Sin clientes anónimos: cada proceso se identifica con usuario y clave
allow_anonymous false
password_file config/mosquitto/passwd

# Mínimo privilegio: qué puede publicar y leer cada usuario
acl_file config/mosquitto/acl.conf

# Pruebas en un solo PC (sin cifrado, sólo loopback)
listener 1883 127.0.0.1

# Planta y gemelo en PCs distintos: TLS en el puerto 8883.
# Descomentar después de generar los certificados (ver README.md de esta carpeta).
#listener 8883
#cafile config/mosquitto/certs/ca.crt
#certfile config/mosquitto/certs/servidor.crt
#keyfile config/mosquitto/certs/servidor.key
