# ACL de mínimo privilegio. Un cliente sin permiso de escritura en un tópico no
# puede inyectar mediciones falsas ni fallas; uno sin permiso de lectura no las ve.
# El Last Will también pasa por la ACL: cada proceso debe poder escribir su tópico de conexión.

user planta
topic write cps/motor1/planta/medicion
topic write cps/motor1/planta/verdad
topic write cps/motor1/planta/conexion
topic read cps/motor1/planta/inyeccion

user gemelo
topic read cps/motor1/planta/medicion
topic read cps/motor1/planta/conexion
topic write cps/motor1/gemelo/#

# Operador: dashboard e inyectar_falla.py
user operador
topic read cps/motor1/#
topic write cps/motor1/planta/inyeccion
